name: 'Sigil Security Scan'
description: 'Scan your repository for malicious patterns in AI agent code, MCP servers, and packages'
author: 'NOMARK'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to scan (relative to repository root)'
    required: false
    default: '.'
  threshold:
    description: 'Minimum verdict to fail the action (low/medium/high/critical): the job fails when the scan verdict is at or above it. Ignored when a policy file is active (its gate decides).'
    required: false
    default: 'medium'
  api-key:
    description: 'Sigil cloud API key for threat intel enrichment (optional)'
    required: false
    default: ''
  fail-on-findings:
    description: 'Whether to fail the action when findings exceed the threshold'
    required: false
    default: 'true'
  phases:
    description: 'Comma-separated list of scan phases to run (all, install-hooks, code-patterns, network-exfil, credentials, obfuscation, provenance, prompt-injection, skill-security)'
    required: false
    default: 'all'
  upload-sarif:
    description: 'Run a second pass in SARIF format and upload it to GitHub Code Scanning via github/codeql-action/upload-sarif. The calling workflow must grant "security-events: write" (and "actions: read" on private repos). The SARIF pass never fails the job on its own.'
    required: false
    default: 'false'
  sarif-file:
    description: 'Path (relative to the workspace) where the SARIF report is written when upload-sarif is true'
    required: false
    default: 'sigil-results.sarif'
  config:
    description: 'Scan policy file (.sigil.yml format) to apply, passed as --config. When a policy is active its gate (fail_on / fail_on_verdict) decides pass or fail instead of threshold. Organisation policies can also be supplied with the SIGIL_POLICY_FILE environment variable.'
    required: false
    default: ''
  baseline:
    description: 'Baseline file (from `sigil baseline`) of accepted findings; only new findings count. Passed as --baseline.'
    required: false
    default: ''
  rules:
    description: 'Custom rule packs (JSON/YAML files or directories), one per line or comma-separated. Each is passed as --rules; custom packs add rules and can never replace built-ins.'
    required: false
    default: ''
  follow-refs:
    description: 'Also download and scan (never run) the scripts and installers the scanned files tell someone to fetch or run (--follow-refs).'
    required: false
    default: 'false'
  report-format:
    description: 'Also write a report in this format to report-file: markdown, junit, html or json. A markdown report is appended to the job summary.'
    required: false
    default: ''
  report-file:
    description: 'Path for the extra report written when report-format is set'
    required: false
    default: 'sigil-report'
  agent-config:
    description: 'Also posture-scan the agent tooling committed to the repository (.mcp.json, .claude/ hooks, settings and skills, .cursor/, .gemini/ and similar) with `sigil skills scan --no-user`. Fails the job at high or above when fail-on-findings is true.'
    required: false
    default: 'false'

outputs:
  verdict:
    description: 'Scan verdict (clean, low, medium, high, critical)'
    value: ${{ steps.scan.outputs.verdict }}
  risk-score:
    description: 'Numeric risk score from the scan'
    value: ${{ steps.scan.outputs.risk-score }}
  findings-count:
    description: 'Total number of findings detected'
    value: ${{ steps.scan.outputs.findings-count }}
  grade:
    description: 'Letter grade A-F derived from the verdict (A no findings, B low-severity only, C medium, D high, F critical); empty on older CLI versions'
    value: ${{ steps.scan.outputs.grade }}
  badge:
    description: 'Ready-to-paste shields.io Markdown badge for the grade; empty when no grade was produced'
    value: ${{ steps.scan.outputs.badge }}
  sarif-file:
    description: 'Path of the SARIF report written by the scan (only set when upload-sarif is true)'
    value: ${{ steps.scan.outputs.sarif-file }}
  gate:
    description: 'pass or fail, as decided by the threshold (or by the policy file when one is active)'
    value: ${{ steps.scan.outputs.gate }}
  report-file:
    description: 'Path of the extra report (only set when report-format is set)'
    value: ${{ steps.scan.outputs.report-file }}

runs:
  using: 'composite'
  steps:
    - name: Set up Sigil scanner
      shell: bash
      run: |
        # Install the Rust sigil binary via the bundled installer. (The legacy
        # bash script in bin/ requires a pre-built Rust engine that plain
        # runners do not have, so it cannot be used directly.)
        if [ -w /usr/local/bin ] || command -v sudo >/dev/null 2>&1; then
          sh "${{ github.action_path }}/install.sh" --no-integrations
        else
          # Sudo-less runner: install to a temp dir and add it to PATH
          SIGIL_BIN_DIR="${RUNNER_TEMP:-$(mktemp -d)}/sigil-bin"
          mkdir -p "$SIGIL_BIN_DIR"
          INSTALL_DIR="$SIGIL_BIN_DIR" sh "${{ github.action_path }}/install.sh" --no-integrations
          echo "$SIGIL_BIN_DIR" >> "$GITHUB_PATH"
        fi

    - name: Run Sigil scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        INPUT_PHASES: ${{ inputs.phases }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_RULES: ${{ inputs.rules }}
        INPUT_FOLLOW_REFS: ${{ inputs.follow-refs }}
        INPUT_REPORT_FORMAT: ${{ inputs.report-format }}
        INPUT_REPORT_FILE: ${{ inputs.report-file }}
        INPUT_AGENT_CONFIG: ${{ inputs.agent-config }}
        SIGIL_ACTION_PATH: ${{ github.action_path }}
      run: |
        chmod +x "${{ github.action_path }}/.github/action-entrypoint.sh"
        "${{ github.action_path }}/.github/action-entrypoint.sh"

    # Opt-in: publish the SARIF pass to GitHub Code Scanning. Guarded with
    # always() so findings are uploaded even when the threshold check above
    # fails the job. Requires `security-events: write` in the caller's
    # permissions block.
    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.upload-sarif == 'true' && always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: sigil
