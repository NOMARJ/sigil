name: False negative
description: Sigil scanned something malicious or risky and did not flag it, or flagged it too low.
title: "[false-negative] "
labels: ["scan-rule"]
body:
  - type: markdown
    attributes:
      value: |
        A miss is the most valuable report we get. Describe the *shape* of what was missed; do not paste a live payload into a public issue. If you have a sample, say so and a maintainer will arrange a private hand-off. If you are reporting a specific malicious package rather than a detection gap, use the **Threat report** form instead.
  - type: input
    id: version
    attributes:
      label: Sigil version
      placeholder: sigil 1.3.6
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Which phase should have caught it?
      description: Pick the closest. Weights are the phase multipliers from the scanner.
      options:
        - install_hooks (Critical, 10x)
        - code_patterns (High, 5x)
        - network_exfil (High, 3x)
        - credentials (Medium, 2x)
        - obfuscation (High, 5x)
        - provenance (Low, 1-3x)
        - prompt_injection (Critical, 10x)
        - skill_security (High, 5x)
        - inference_security (High, 5x)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What was missed
      description: Describe the technique in words. Where it lived (install hook, tool description, config file, runtime code), what it did, and what it would take to spot it. A defanged excerpt with the operative parts replaced by `<...>` is fine.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What Sigil reported
      description: The summary block from the scan (verdict, score, grade) and any findings that did fire. `sigil scan <path> --format json` output with private paths redacted is ideal.
      render: text
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source or reference
      description: Advisory, blog post, CVE, or campaign name if this is a known technique. Leave blank if it is original research.
      placeholder: CISA AA25-266A
  - type: dropdown
    id: sample
    attributes:
      label: Do you have a sample you can share privately?
      options:
        - "No"
        - Yes, a synthetic reproduction I wrote
        - Yes, a real sample (maintainer will arrange hand-off)
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: This issue contains no live malicious payload, credentials, or exfiltration endpoints.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
