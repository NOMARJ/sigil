name: Publish MCP Server

on:
  push:
    tags:
      - "mcp-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "MCP server version to publish (e.g., 1.3.0)"
        required: true

jobs:
  build-and-publish:
    name: Build and Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugins/mcp-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/mcp-v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing @nomark/sigil-mcp-server version: ${VERSION}"

      - name: Verify version matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${PKG_VERSION}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag/input version ${{ steps.version.outputs.version }} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
