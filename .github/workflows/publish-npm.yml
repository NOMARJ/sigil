name: Publish npm Package

# Manually re-publish @nomarj/sigil for an existing release tag. Exists so a
# failed npm step in release.yml (e.g. the v1.3.5 run, where the @nomarj npm
# scope did not exist yet) can be completed without re-running the release job
# — that job cannot re-run cleanly once its immutable release is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.3.5)"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Publishes via npm Trusted Publishing (OIDC): no NPM_TOKEN secret at all.
# npmjs.com > @nomarj/sigil > Settings > Trusted Publisher must point at
# THIS workflow file (org NOMARJ, repo sigil, workflow publish-npm.yml).
# npm allows one trusted publisher per package, so this is the only
# workflow that runs `npm publish` — release.yml dispatches it.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @nomarj/sigil
    runs-on: ubuntu-latest
    steps:
      # The tag reaches the shell through the environment, never through
      # expression interpolation into the script: an expression is substituted
      # before bash parses the line, so a tag containing shell syntax would be
      # executed rather than read. Checked before anything else runs.
      - name: Refuse anything but a vX.Y.Z tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${TAG}' is not vX.Y.Z, the only form release.yml builds"
            exit 1
          fi

      # refs/tags/ so a branch that happens to share the tag's name is never
      # what gets published.
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}

      # Node 24 bundles npm >= 11.5.1, the minimum for trusted publishing.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if npm view "@nomarj/sigil@${VERSION}" version >/dev/null 2>&1; then
            echo "@nomarj/sigil ${VERSION} is already on npm — nothing to do"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public
