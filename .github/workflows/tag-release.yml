name: Tag Release

# Creates a vX.Y.Z tag on a commit of the default branch and starts
# release.yml for it. Use it when the tag cannot be pushed from git, for
# example from an environment whose credentials may push branches but not
# tags. Pushing the tag from git (docs/RELEASING.md) remains the normal path.
#
# A tag created with the workflow token does not fire release.yml's push
# trigger (GitHub starts no workflow from a GITHUB_TOKEN push), so this job
# dispatches release.yml on the new tag instead: a dispatch is the one event
# GitHub lets that token start, and release.yml already relies on it for npm
# and Homebrew. The run then sees the tag as its ref, exactly as for a pushed
# tag. Nothing here creates a GitHub release; release.yml still builds the
# binaries, attaches them to a draft and only then publishes it. Never create
# the release from the web UI: it publishes an immutable, assetless release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.3.7"
        required: true
      sha:
        description: "Full 40-character SHA of the commit on the default branch to tag"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: write
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Create the tag and start the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Inputs reach the shell through the environment, never through
      # expression interpolation into the script.
      - name: Refuse anything but a new vX.Y.Z tag on the default branch
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${TAG}' is not vX.Y.Z, the only form release.yml builds"
            exit 1
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${SHA} is not on ${DEFAULT_BRANCH}"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists. Never re-point a tag; release a new version instead (docs/RELEASING.md)."
            exit 1
          fi
          git -c advice.detachedHead=false checkout -q "$SHA"
          python3 scripts/check_versions.py --expect "$TAG"

      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${SHA}" >/dev/null
          echo "Created ${TAG} at ${SHA}"

      - name: Start release.yml on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"
          echo "Dispatched release.yml on ${TAG}"
