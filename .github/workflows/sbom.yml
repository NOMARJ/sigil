name: SBOM Generation & Attestation

# Trigger on version tags and allow manual runs
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# Required permissions for SBOM generation, signing, and release publishing
permissions:
  actions: read # Download build artifacts through gh CLI
  contents: write # Attach SBOM files to the draft release (see the attach step)
  id-token: write # Cosign keyless signing with OIDC
  packages: read # Access Docker images

env:
  REGISTRY: docker.io
  CLI_IMAGE_NAME: nomark/sigil
  FULL_IMAGE_NAME: nomark/sigil-full
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Job 1: Generate SBOMs from source repository
  generate-sbom:
    name: Generate Source SBOMs
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository at the tagged version
      - name: Checkout code
        uses: actions/checkout@v5

      # Install Syft for SBOM generation
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.0

      # Install Cosign for attestation signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3

      # Extract version from tag (remove 'v' prefix)
      - name: Set version variable
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generating SBOMs for version: ${VERSION}"

      # Generate CycloneDX SBOM in JSON format (OWASP standard). syft 1.x
      # names the source with --source-name/--source-version; the old
      # --name/--version flags are gone ("unknown flag: --name", which
      # failed this job on every tag through v1.3.7).
      - name: Generate CycloneDX SBOM from source
        run: |
          syft dir:. \
            -o cyclonedx-json=sbom-source.cdx.json \
            --source-name sigil \
            --source-version ${{ steps.version.outputs.version }}
          echo "✅ CycloneDX SBOM generated"

      # Generate SPDX SBOM in JSON format (Linux Foundation standard)
      - name: Generate SPDX SBOM from source
        run: |
          syft dir:. \
            -o spdx-json=sbom-source.spdx.json \
            --source-name sigil \
            --source-version ${{ steps.version.outputs.version }}
          echo "✅ SPDX SBOM generated"

      # Verify SBOM files were created
      - name: Verify SBOMs
        run: |
          ls -lh sbom-source.*
          echo "CycloneDX SBOM size: $(wc -c < sbom-source.cdx.json) bytes"
          echo "SPDX SBOM size: $(wc -c < sbom-source.spdx.json) bytes"

      # Upload SBOMs as artifacts for downstream jobs
      - name: Upload source SBOMs
        uses: actions/upload-artifact@v6
        with:
          name: source-sboms
          path: |
            sbom-source.cdx.json
            sbom-source.spdx.json
          retention-days: 30

  # Job 2: Generate SBOMs from container images (requires Docker images to exist)
  container-sbom:
    name: Generate Container SBOMs
    runs-on: ubuntu-latest

    steps:
      # Checkout for context
      - name: Checkout code
        uses: actions/checkout@v5

      # Install Syft for container SBOM generation
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.0

      # Install Cosign for attestation
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3

      # Extract version from tag
      - name: Set version variable
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generating container SBOMs for version: ${VERSION}"

      # Login to Docker Hub to pull images
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Wait for Docker images to be available (retry logic)
      - name: Wait for Docker images
        run: |
          echo "Waiting for Docker images to be published..."
          MAX_ATTEMPTS=30
          SLEEP_TIME=20

          for i in $(seq 1 $MAX_ATTEMPTS); do
            if docker pull ${{ env.CLI_IMAGE_NAME }}:${{ steps.version.outputs.version }} && \
               docker pull ${{ env.FULL_IMAGE_NAME }}:${{ steps.version.outputs.version }}; then
              echo "✅ Both images are available"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: Images not ready yet, waiting ${SLEEP_TIME}s..."
            sleep $SLEEP_TIME
          done

          echo "❌ Timeout waiting for Docker images"
          exit 1

      # Generate CycloneDX SBOM from CLI container image
      - name: Generate CLI container SBOM
        run: |
          syft docker:${{ env.CLI_IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -o cyclonedx-json=sbom-cli-container.cdx.json
          echo "✅ CLI container SBOM generated"

      # Generate CycloneDX SBOM from full container image
      - name: Generate full container SBOM
        run: |
          syft docker:${{ env.FULL_IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -o cyclonedx-json=sbom-full-container.cdx.json
          echo "✅ Full container SBOM generated"

      # Generate SPDX format for CLI container
      - name: Generate CLI container SPDX SBOM
        run: |
          syft docker:${{ env.CLI_IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -o spdx-json=sbom-cli-container.spdx.json
          echo "✅ CLI container SPDX SBOM generated"

      # Generate SPDX format for full container
      - name: Generate full container SPDX SBOM
        run: |
          syft docker:${{ env.FULL_IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -o spdx-json=sbom-full-container.spdx.json
          echo "✅ Full container SPDX SBOM generated"

      # Verify container SBOM files
      - name: Verify container SBOMs
        run: |
          ls -lh sbom-*-container.*
          echo "CLI CycloneDX SBOM: $(wc -c < sbom-cli-container.cdx.json) bytes"
          echo "CLI SPDX SBOM: $(wc -c < sbom-cli-container.spdx.json) bytes"
          echo "Full CycloneDX SBOM: $(wc -c < sbom-full-container.cdx.json) bytes"
          echo "Full SPDX SBOM: $(wc -c < sbom-full-container.spdx.json) bytes"

      # Upload container SBOMs as artifacts
      - name: Upload container SBOMs
        uses: actions/upload-artifact@v6
        with:
          name: container-sboms
          path: |
            sbom-cli-container.cdx.json
            sbom-cli-container.spdx.json
            sbom-full-container.cdx.json
            sbom-full-container.spdx.json
          retention-days: 30

  # Job 3: Attest SBOMs with Cosign and publish to release
  attest-and-publish:
    name: Attest SBOMs & Publish
    needs: [generate-sbom, container-sbom]
    runs-on: ubuntu-latest

    steps:
      # Checkout for release context
      - name: Checkout code
        uses: actions/checkout@v5

      # Install Cosign for keyless signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3

      # Download source SBOMs from generate-sbom job
      - name: Download source SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name source-sboms --dir sboms/

      # Download container SBOMs from container-sbom job
      - name: Download container SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name container-sboms --dir sboms/

      # List all downloaded SBOMs
      - name: List all SBOMs
        run: |
          echo "All SBOMs ready for attestation:"
          ls -lh sboms/

      # Sign source CycloneDX SBOM with Cosign keyless signing
      - name: Attest source CycloneDX SBOM
        working-directory: sboms
        run: |
          cosign attest-blob \
            --yes \
            --predicate sbom-source.cdx.json \
            --type cyclonedx \
            sbom-source.cdx.json > sbom-source.cdx.json.att
          echo "✅ Source CycloneDX SBOM attested"

      # Sign source SPDX SBOM
      - name: Attest source SPDX SBOM
        working-directory: sboms
        run: |
          cosign attest-blob \
            --yes \
            --predicate sbom-source.spdx.json \
            --type spdx \
            sbom-source.spdx.json > sbom-source.spdx.json.att
          echo "✅ Source SPDX SBOM attested"

      # Sign CLI container CycloneDX SBOM
      - name: Attest CLI container CycloneDX SBOM
        working-directory: sboms
        run: |
          cosign attest-blob \
            --yes \
            --predicate sbom-cli-container.cdx.json \
            --type cyclonedx \
            sbom-cli-container.cdx.json > sbom-cli-container.cdx.json.att
          echo "✅ CLI container CycloneDX SBOM attested"

      # Sign CLI container SPDX SBOM
      - name: Attest CLI container SPDX SBOM
        working-directory: sboms
        run: |
          cosign attest-blob \
            --yes \
            --predicate sbom-cli-container.spdx.json \
            --type spdx \
            sbom-cli-container.spdx.json > sbom-cli-container.spdx.json.att
          echo "✅ CLI container SPDX SBOM attested"

      # Sign full container CycloneDX SBOM
      - name: Attest full container CycloneDX SBOM
        working-directory: sboms
        run: |
          cosign attest-blob \
            --yes \
            --predicate sbom-full-container.cdx.json \
            --type cyclonedx \
            sbom-full-container.cdx.json > sbom-full-container.cdx.json.att
          echo "✅ Full container CycloneDX SBOM attested"

      # Sign full container SPDX SBOM
      - name: Attest full container SPDX SBOM
        working-directory: sboms
        run: |
          cosign attest-blob \
            --yes \
            --predicate sbom-full-container.spdx.json \
            --type spdx \
            sbom-full-container.spdx.json > sbom-full-container.spdx.json.att
          echo "✅ Full container SPDX SBOM attested"

      # Verify all attestations were created
      - name: Verify attestations
        working-directory: sboms
        run: |
          echo "All SBOMs and attestations:"
          ls -lh
          echo ""
          echo "Attestation count: $(ls -1 *.att | wc -l)"
          echo "SBOM count: $(ls -1 *.json | wc -l)"

      # Generate checksums for all SBOM files
      - name: Generate SBOM checksums
        working-directory: sboms
        run: |
          sha256sum *.json *.att > SBOM-SHA256SUMS.txt
          echo "✅ Checksums generated:"
          cat SBOM-SHA256SUMS.txt

      # Keep the signed set with the run whatever happens below: a release
      # that is already published can never receive these files.
      - name: Upload signed SBOM set
        uses: actions/upload-artifact@v6
        with:
          name: signed-sboms
          path: sboms/
          if-no-files-found: error
          retention-days: 90

      # release.yml owns the release: it creates a draft, attaches the
      # binaries and then publishes it, and the repo uses immutable releases,
      # so a published release can never receive files. This step therefore
      # only adds files to that draft. It never creates a release (one created
      # here would be published before the binaries exist and could never
      # receive them, which breaks the version for good), never touches the
      # release notes, and leaves a published release alone.
      - name: Attach SBOMs to the draft release
        id: attach
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES=(
            sboms/sbom-source.cdx.json
            sboms/sbom-source.cdx.json.att
            sboms/sbom-source.spdx.json
            sboms/sbom-source.spdx.json.att
            sboms/sbom-cli-container.cdx.json
            sboms/sbom-cli-container.cdx.json.att
            sboms/sbom-cli-container.spdx.json
            sboms/sbom-cli-container.spdx.json.att
            sboms/sbom-full-container.cdx.json
            sboms/sbom-full-container.cdx.json.att
            sboms/sbom-full-container.spdx.json
            sboms/sbom-full-container.spdx.json.att
            sboms/SBOM-SHA256SUMS.txt
          )
          # gh finds a draft by its tag too; any lookup failure counts as
          # "no release", which is the case that must never create one.
          release_state() {
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft 2>/dev/null || echo absent
          }
          ARTIFACT_NOTE="The signed SBOMs are in this run's signed-sboms artifact."
          STATE="$(release_state)"
          case "$STATE" in
            true)
              # Each .att signs its own run's JSON and the checksums cover one
              # run, so the draft must hold a single run's set. A complete set
              # is never replaced (a failed re-upload would lose it); a partial
              # one, left by an earlier failed upload, is replaced whole.
              ATTACHED_NAMES="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name')"
              MISSING=0
              for f in "${FILES[@]}"; do
                grep -qxF -- "${f#sboms/}" <<<"$ATTACHED_NAMES" || MISSING=$((MISSING + 1))
              done
              if [ "$MISSING" -eq 0 ]; then
                echo "attached=true" >> "$GITHUB_OUTPUT"
                echo "The ${GITHUB_REF_NAME} draft already has the complete SBOM set; left as is"
              elif gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"; then
                echo "attached=true" >> "$GITHUB_OUTPUT"
                echo "Attached the SBOMs to the ${GITHUB_REF_NAME} draft release"
              elif [ "$(release_state)" = "false" ]; then
                # release.yml published the draft while this upload ran. The
                # check above cannot be atomic with its publish step, and an
                # immutable release takes no more files, so it may now carry
                # part of the set.
                echo "::warning::${GITHUB_REF_NAME} was published while the SBOMs were uploading, so the release may carry only part of the set. ${ARTIFACT_NOTE}"
                echo "attached=false" >> "$GITHUB_OUTPUT"
              else
                echo "::error::Uploading the SBOMs to the ${GITHUB_REF_NAME} draft release failed"
                exit 1
              fi ;;
            false)
              echo "::warning::${GITHUB_REF_NAME} is already published, and an immutable release cannot receive files. ${ARTIFACT_NOTE}"
              echo "attached=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::warning::No release exists for ${GITHUB_REF_NAME}. This workflow never creates one (release.yml does). ${ARTIFACT_NOTE}"
              echo "attached=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Summary output
      - name: Summary
        env:
          ATTACHED: ${{ steps.attach.outputs.attached }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## SBOMs generated and attested for Sigil ${GITHUB_REF_NAME}"
            echo ""
            echo "### Formats Generated:"
            echo "- CycloneDX JSON (OWASP standard)"
            echo "- SPDX JSON (Linux Foundation standard)"
            echo ""
            echo "### Artifacts:"
            echo "- Source repository SBOMs (2 formats)"
            echo "- CLI container SBOMs (2 formats)"
            echo "- Full container SBOMs (2 formats)"
            echo "- Cosign attestations for all SBOMs"
            echo "- SHA256 checksums"
            echo ""
            if [ "$ATTACHED" = "true" ]; then
              echo "Attached to the draft release for ${GITHUB_REF_NAME}; they publish with it."
            else
              echo "Not attached to a release (see the warning above). Download the signed-sboms artifact from ${RUN_URL}."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
