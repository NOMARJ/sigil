name: Update Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.6). Defaults to latest release if omitted."
        required: false
        type: string

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v5
        with:
          repository: NOMARJ/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      # Tags reach the shell through the environment, never through
      # expression interpolation into the script: an expression is substituted
      # before bash parses the line, so a tag containing shell syntax would be
      # executed rather than read. Every later step uses the validated
      # step outputs.
      - name: Get release info
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=""
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
            # Releases of the other ship channels (vscode-v…, jetbrains-v…,
            # plugin-v…) publish here too; only a CLI release has these
            # binaries, so anything else is not a Homebrew update.
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release ${TAG} is not a CLI release; the formula is unchanged"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            RELEASE_JSON_FILE="$(mktemp)"
            HTTP_CODE="$(curl -sS -o "$RELEASE_JSON_FILE" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")"

            if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::GitHub API request failed while fetching latest release tag (HTTP $HTTP_CODE)."
              if [ -s "$RELEASE_JSON_FILE" ]; then
                cat "$RELEASE_JSON_FILE"
              fi
              exit 1
            fi

            TAG="$(jq -r '.tag_name' < "$RELEASE_JSON_FILE")"
            rm -f "$RELEASE_JSON_FILE"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '${TAG}' is not vX.Y.Z, the only form release.yml builds."
            exit 1
          fi

          {
            echo "version=${TAG#v}"
            echo "tag=$TAG"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - name: Download checksums
        if: steps.release.outputs.skip != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/SHA256SUMS.txt" -o SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A missing or malformed hash would write a formula that cannot install,
      # so each one must be exactly 64 hex characters.
      - name: Extract SHA256 hashes
        id: hashes
        if: steps.release.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Each hash is assigned before it is written, so a failed lookup
          # stops the step (set -e does not see a failure inside an echo).
          hash_of() {
            local h
            h="$(awk -v f="$1" '$2 == f || $2 == "*" f {print $1}' SHA256SUMS.txt)"
            if [[ ! "$h" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::SHA256SUMS.txt has no single valid hash for $1" >&2
              return 1
            fi
            echo "$h"
          }
          MACOS_ARM64_SHA="$(hash_of sigil-macos-arm64.tar.gz)"
          MACOS_X64_SHA="$(hash_of sigil-macos-x64.tar.gz)"
          LINUX_X64_SHA="$(hash_of sigil-linux-x64.tar.gz)"
          LINUX_ARM64_SHA="$(hash_of sigil-linux-arm64.tar.gz)"
          {
            echo "macos_arm64_sha=${MACOS_ARM64_SHA}"
            echo "macos_x64_sha=${MACOS_X64_SHA}"
            echo "linux_x64_sha=${LINUX_X64_SHA}"
            echo "linux_arm64_sha=${LINUX_ARM64_SHA}"
          } >> "$GITHUB_OUTPUT"

      # No post_install: Homebrew already links bin/sigil into its prefix.
      # The old `sigil install` there copied the binary to /usr/local/bin,
      # which on an Intel Mac is the Homebrew symlink to that same binary,
      # and copying a file onto a symlink to itself truncates it to 0 bytes.
      - name: Update Formula
        if: steps.release.outputs.skip != 'true'
        run: |
          cat > homebrew-tap/Formula/sigil.rb << 'EOF'
          class Sigil < Formula
            desc "Automated security auditing for AI agent code"
            homepage "https://sigilsec.ai"
            license "Apache-2.0"
            version "${{ steps.release.outputs.version }}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/sigil-macos-arm64.tar.gz"
                sha256 "${{ steps.hashes.outputs.macos_arm64_sha }}"
              else
                url "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/sigil-macos-x64.tar.gz"
                sha256 "${{ steps.hashes.outputs.macos_x64_sha }}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/sigil-linux-arm64.tar.gz"
                sha256 "${{ steps.hashes.outputs.linux_arm64_sha }}"
              else
                url "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/sigil-linux-x64.tar.gz"
                sha256 "${{ steps.hashes.outputs.linux_x64_sha }}"
              end
            end

            def install
              bin.install "sigil"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/sigil --version")
              (testpath/"test.py").write("print('hello')")
              system "#{bin}/sigil", "scan", testpath/"test.py"
            end
          end
          EOF
          ruby -c homebrew-tap/Formula/sigil.rb

      # A re-run for a version the tap already has changes nothing; that is
      # success, not a failed commit.
      - name: Commit and push
        if: steps.release.outputs.skip != 'true'
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sigil.rb
          if git diff --cached --quiet; then
            echo "Formula/sigil.rb is already at ${VERSION}; nothing to push"
            exit 0
          fi
          git commit -m "Update sigil to ${VERSION}"
          git push
