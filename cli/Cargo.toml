[package]
name = "sigil-cli"
version = "1.3.6"
edition = "2021"
description = "Automated security auditing for AI agent code - quarantine-first scanning for pip, npm, git repos, and MCP servers"
license = "Apache-2.0"
repository = "https://github.com/NOMARJ/sigil"
homepage = "https://sigilsec.ai"
keywords = ["security", "scanning", "supply-chain", "malware", "ai-agent"]
categories = ["command-line-utilities", "development-tools"]
readme = "../README.md"
authors = ["NOMARJ <hello@sigilsec.ai>"]

[[bin]]
name = "sigil"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# native-tls-vendored statically compiles OpenSSL into the binary: required
# for the aarch64-linux cross build (no target-arch libssl headers in the
# cross container — release run 33235288512 failed there), and it makes the
# published binaries independent of each distro's system libssl.
reqwest = { version = "0.11", features = ["json", "blocking", "native-tls-vendored"] }
regex = "1"
# The engine `regex` itself runs on, with exactly the features `regex` enables
# (so nothing new is compiled): YARA rules need byte-level search over a span
# of a haystack, which `regex::bytes` does not expose.
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "nfa-backtrack", "hybrid", "dfa-onepass", "perf-inline", "perf-literal", "unicode"] }
# Its parser, with the features `regex` enables: a YARA string's parsed form
# is inspected for counted repetition before it is compiled.
regex-syntax = "0.8"
# Already built for reqwest's URL handling (url -> idna), with the same
# features: the LLM review stage's checks read compatibility letters (NFKC)
# before matching, so nothing new is compiled.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
walkdir = "2"
ignore = "0.4"
rayon = "1"
sha2 = "0.10"
hex = "0.4"
colored = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
zip = "0.6"
flate2 = "1"
tar = "0.4"
serde_yaml = "0.9"
ed25519-dalek = { version = "2", features = ["serde"] }
base64 = "0.22"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
